name: CI

on:
  # Tags run CI through release.yml, so a tag push does not run it twice.
  # Skip changes only to files that no build, test, fmt or audit step reads.
  # workflow_call ignores paths filters, so a release always runs CI.
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '*.md', LICENSE, .gitignore, dprint.json]
  pull_request:
    paths-ignore: ['docs/**', '*.md', LICENSE, .gitignore, dprint.json]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg
      - run: gpg --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # GPG integration tests fail instead of skipping when CI is set.
      - run: cargo test --all-features
      - run: cargo build --release

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
