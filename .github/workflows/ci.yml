name: CI

on:
  # Tags run CI through release.yml, so a tag push does not run it twice.
  # Skip changes only to files that no build, test, fmt or audit step reads.
  # workflow_call ignores paths filters, so a release always runs CI.
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '*.md', LICENSE, .gitignore, dprint.json]
  pull_request:
    paths-ignore: ['docs/**', '*.md', LICENSE, .gitignore, dprint.json]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg
      - run: gpg --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # GPG integration tests fail instead of skipping when CI is set.
      - run: cargo test --all-features
      - run: cargo build --release

  # The test job takes the newest stable. This job proves that rust-version
  # in Cargo.toml still builds and passes the tests.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo test --all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
