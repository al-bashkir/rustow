name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # Read-only also when the repository default changes.
    permissions:
      contents: read

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Pinned: this job makes the binaries that users download.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Check that the tag matches the Cargo.toml version
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$GITHUB_REF_NAME"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="rustow-$GITHUB_REF_NAME-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/rustow"
          mkdir -p "$name/completions"
          cp "$bin" README.md LICENSE "$name/"
          # Each target builds on its own platform, so the binary runs here.
          "$bin" completions bash > "$name/completions/rustow.bash"
          "$bin" completions zsh > "$name/completions/_rustow"
          "$bin" completions fish > "$name/completions/rustow.fish"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: rustow-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every artifact of the run, each in a directory with its name. A step
      # of the ci job can upload artifacts too; if it takes a name of the
      # build job first, the build job's upload fails.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Take the build job's tarballs
        run: |
          mkdir dist
          # The targets of the build matrix.
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin; do
            mv "artifacts/$target/rustow-$GITHUB_REF_NAME-$target.tar.gz" dist/
          done
          left=$(find artifacts -type f)
          if [ -n "$left" ]; then
            printf 'Not from the build job, or a target missing above:\n%s\n' "$left"
            exit 1
          fi
      - run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
