[package]
name = "rustow"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Flat-repository dotfiles and configuration manager: symlinks, copies, templates, age/GPG secrets"
license = "MIT"
readme = "README.md"
categories = ["command-line-utilities", "config"]
keywords = ["dotfiles", "stow", "symlink", "templates", "age"]

[dependencies]
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
toml_edit = { version = "0.25.19", features = ["serde"] }
walkdir = "2.5.0"

[profile.release]
lto = "thin"

[dev-dependencies]
tempfile = "3.27.0"
