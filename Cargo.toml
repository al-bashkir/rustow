[package]
name = "rustow"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Flat-repository dotfiles and configuration manager: symlinks, copies, templates, age/GPG secrets"
license = "MIT"
readme = "README.md"
categories = ["command-line-utilities", "config"]
keywords = ["dotfiles", "stow", "symlink", "templates", "age"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
ignore = "0.4.34"
minijinja = { version = "3.1.0", features = ["serde"] }
nix = { version = "0.31.3", features = ["fs", "hostname", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
similar = "3.2.1"
tempfile = "3.27.0"
thiserror = "2"
toml_edit = { version = "0.25.19", features = ["serde"] }
walkdir = "2.5.0"
zeroize = "1.9.1"

[profile.release]
lto = "thin"

